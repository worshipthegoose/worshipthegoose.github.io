<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/cursor.css">
<style>
    * {
        font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard', 'Chalkboard SE', sans-serif;
    }
textarea {
	width:300px !important;
    height:300px !important;
    font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard', 'Chalkboard SE', sans-serif;
    padding:8px;
}
textarea.translated {
    cursor:text !important;
    user-select: text; 
    user-drag: none; 
    -webkit-user-drag: none;
    background-color: #f9f9f9;
    color: #333;
}
textarea.translator:focus{
	border-width:2px;
}
.translator-content, .translator-container, .translated-container {
	text-align:center;
    display:flex;
    justify-content:center;
    align-items:center;
    
}
.translator-content, .translated-container {
	flex-direction:column !important;
}
.translator-container { gap:15px; }
.translated-container{
    background-color: white;
    width:fit-content;
    padding:2%;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%)
}
.translated-container button {
	width:fit-content;
    text-align:center;
    margin:8px auto;
    padding:4.5px 6px;
    font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard', 'Chalkboard SE', sans-serif;
    font-size:23px;
    background: steelblue;
    color:white;
    border:none;
    border-radius:7px;
    transition:background 0.3s ease;
}
.translated-container button:hover{
	background:royalblue !important;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const translator = document.querySelector("textarea.translator");
  const translated = document.querySelector("textarea.translated");
  
  translator.addEventListener("input", function() {
    translated.value = "";
    let content = translator.value;
    let translateList = content.split(' ');
    
    for (let latinWord of translateList) {
      if (latinWord.length === 0) continue;
      
      let lastChar = latinWord.charAt(latinWord.length - 1);
      let hasPunctuation = ['.', '!', '?'].includes(lastChar);
      let cleanWord = hasPunctuation ? latinWord.slice(0, -1) : latinWord;
      
      if (cleanWord.length === 0) {
        if (translated.value.length === 0) {
          translated.value = lastChar;
        } else {
          translated.value += ` ${lastChar}`;
        }
        continue;
      }
      
      let firstLetter = cleanWord.charAt(0);
      let remainingWord = cleanWord.slice(1);
      let tempWord = `${remainingWord}${firstLetter}`;
      
      if (tempWord.length % 2 !== 0) {
        tempWord += 'honk';
      } else {
        tempWord += 'duck';
      }
      
      if (hasPunctuation) {
        tempWord += lastChar;
      }
      
      if (translated.value.length === 0) {
        translated.value = tempWord;
      } else {
        translated.value += ` ${tempWord}`;
      }
    }
  });
});

</script>
</head>
<body>
<div class="translated-container">
  <div class="translator-container">
      <div class="translator-content">
      <p><strong>Goose Latin</strong></p>
        <textarea class="translator" placeholder="Enter Goose Latin Here" width="500" height="500"></textarea>
      </div>
      <div class="translator-content">
        <p><strong>English</strong></p>
        <textarea class="translated" placeholder="English Will Appear Here" width="500" height="500" readonly onfocus="this.select()"></textarea>
      </div>
  </div>
  <button type="button">Swap!</button>
</div>

</body>
</html>
