<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riker's Science Presentation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQQTeIcjIKmjUPsz1EZMHl4X7Tkaw5ceoimJ3uxlHH3tq4goWTcXwBkDkzK3K6QHciZjoZn-ZN5cWj4/pubembed?start=true&loop=true&delayms=10000" frameborder="0" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
    <script>
        var quietText = document.createElement("h1");
        quietText.className = "quiet";
        quietText.style.cssText = `
            text-align:center !important;
            position: fixed;
            inset: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 10;
            pointer-events: none;
            font-size: 114px;
            font-family: impact;
            opacity: 0;
            transition: opacity .4s ease;
        `;
        document.body.appendChild(quietText);

        document.addEventListener('keydown', function(event) {
            if (event.key.toLowerCase() === 'z') {
                quietText.textContent = "Silence, everyone!";
                quietText.style.opacity = "1";
                setTimeout(()=>{
                    quietText.textContent = "The presentation is about to start.";
                    setTimeout(()=>{
                        quietText.textContent = "Thank you.";
                        setTimeout(()=>{quietText.style.opacity="0"}, 2000);
                    }, 2000);
                }, 2000)
            }
        });
    </script>
</body>
</html>
